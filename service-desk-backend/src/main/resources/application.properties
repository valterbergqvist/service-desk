spring.application.name=service-desk-backend
server.port=8080

# Embedded in-memory H2 database (data resets on restart).
# To keep data between restarts, use: jdbc:h2:file:./data/servicedesk
spring.datasource.url=jdbc:h2:mem:servicedesk;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origin=http://localhost:5173

# Adds sample agents and tickets on startup
app.seed-demo=true
